<title>Sva</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single phone-sized app column (full-bleed on phones), tab bar at the bottom, sheets slide over the app.
   Colours, type and components follow docs/DESIGN.md. Bare :root is Daylight; Midnight sun (the brand default) comes from
   the OS dark setting or data-theme="dark" on <html>. The Theme setting in the prototype sets data-theme on .phone, which wins. */
:root,.phone[data-theme="light"]{
  color-scheme:light;
  --bg:#FBF5EC; --surface:#FFFFFF; --sunk:#F3EADB; --line:#E4D8C5; --ink:#1B2240; --muted:#5B6185;
  --granite:#AC482F; --granite-light:#D4694C; --accent:#AC482F; --accent-ink:#FFFFFF; --sea:#2E6E7E;
  --os:#2E6E7E; --fl:#85590A; --rp:#AC482F; --att:#5B6185;
  --good:#2D764C; --warn:#85590A; --bad:#B33A30;
  --desk:#EDE3D2; --foam:#F7E7CE; --scrim:rgba(27,34,64,.8); --backdrop:rgba(14,19,40,.45);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#1B2240; --surface:#232B4D; --sunk:#141A33; --line:#343D63; --ink:#F7E7CE; --muted:#A9AECB;
  --granite:#E07A5F; --granite-light:#F0A08A; --accent:#F2B544; --accent-ink:#1B2240; --sea:#6FB3C2;
  --os:#6FB3C2; --fl:#F2B544; --rp:#E07A5F; --att:#A9AECB;
  --good:#7CC49A; --warn:#F2B544; --bad:#F07A70;
  --desk:#0E1328;
 }
}
:root[data-theme="dark"],.phone[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1B2240; --surface:#232B4D; --sunk:#141A33; --line:#343D63; --ink:#F7E7CE; --muted:#A9AECB;
  --granite:#E07A5F; --granite-light:#F0A08A; --accent:#F2B544; --accent-ink:#1B2240; --sea:#6FB3C2;
  --os:#6FB3C2; --fl:#F2B544; --rp:#E07A5F; --att:#A9AECB;
  --good:#7CC49A; --warn:#F2B544; --bad:#F07A70;
  --desk:#0E1328;
}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;display:flex;justify-content:center;align-items:center;padding-block:20px;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button[disabled]{cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.phone{width:min(400px,100%);height:min(860px,100%);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:30px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
@media (max-width:520px){body{display:block;padding-block:0}.phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}}
.screen{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:24px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 12px}
h1{font-family:var(--f-display);font-optical-sizing:auto;font-weight:600;font-size:32px;line-height:36px;margin:0}
h2{font-family:var(--f-display);font-optical-sizing:auto;font-weight:600;font-size:22px;line-height:28px;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0}
.brand{display:flex;align-items:center;gap:8px}
.brand .sva-mark{width:36px;height:36px;flex:none}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.pill{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--muted);color:var(--muted);border-radius:99px;padding:2px 8px;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.section{display:flex;flex-direction:column;gap:10px;padding-top:20px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--foam);flex:none;background-size:cover;background-position:center}
.who{border:0;background:transparent;padding:0;text-align:left;display:flex;align-items:center;gap:8px;min-width:0}
.pfp{position:relative;cursor:pointer;display:inline-block;border-radius:50%}
.pfp-badge{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--granite);color:var(--bg);display:grid;place-items:center;border:2px solid var(--bg)}
.pfp-badge svg{width:14px;height:14px}
.grade{font-family:var(--f-body);font-weight:700;font-size:14px;line-height:16px;font-variant-numeric:tabular-nums;padding:3px 7px;border-radius:6px;background:var(--ink);color:var(--bg);white-space:nowrap}
.grade.sm{font-size:13px;padding:2px 6px}
.grade.gym{box-shadow:inset 0 0 0 1px rgba(127,127,127,.35);font-size:12px;padding:4px 7px}
.grade.un{background:transparent;color:var(--muted);border:1px dashed var(--line);font-size:11px;font-weight:600}
.style{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;color:var(--bg);white-space:nowrap}
.s-Onsight{background:var(--os)}.s-Flash{background:var(--fl)}.s-Redpoint{background:var(--rp)}.s-Repeat{background:var(--muted)}.s-Attempt{background:transparent;color:var(--muted);border:1px solid var(--att)}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--sunk);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:500;line-height:18px;display:inline-flex;align-items:center;gap:6px;transition:background-color .12s ease-out,color .12s ease-out}
.chip:hover{border-color:var(--line)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[disabled]{opacity:.4;text-decoration:line-through}
.chip.inh{background:transparent;border:1px dashed var(--line);cursor:default}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(127,127,127,.4);flex:none}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600}
.btn{border:1px solid var(--accent);border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn[disabled]{opacity:.4}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.iconbtn{border:0;background:transparent;padding:6px;border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--sunk)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:500;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea.input{resize:vertical;min-height:64px}
select.input{appearance:auto}
input[type=color]{width:38px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface);flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--sunk);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:4px 0}
.tab.on{color:var(--ink);font-weight:600}
.tab svg{width:24px;height:24px}
.tab.log span.plus{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
/* feed */
.post{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.post-title{font-size:17px;line-height:24px;font-weight:600;margin:0;text-wrap:balance}
.post-desc{margin:0;font-size:14px;max-width:65ch}
.topo{display:block;width:100%;border-radius:16px;background:var(--sunk)}
.climbs{display:flex;flex-direction:column;gap:6px}
.climb{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.climb .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat .v{font-weight:600;font-size:22px;line-height:26px;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;line-height:16px;color:var(--muted)}
.actions{display:flex;gap:6px}
.act{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.act svg{width:16px;height:16px}
.act.on{border-color:var(--granite);color:var(--granite)}
/* media */
.mstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.media{position:relative;flex:none;width:96px;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunk);border:0;padding:0}
.media>img,.media>video,.media>svg{width:100%;height:100%;object-fit:cover;display:block}
.mtag{position:absolute;left:4px;bottom:4px;max-width:calc(100% - 8px);background:var(--scrim);color:var(--foam);font-size:10px;font-weight:600;padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvid{position:absolute;right:4px;top:4px;background:var(--scrim);color:var(--foam);font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums;padding:1px 5px;border-radius:4px;display:inline-flex;align-items:center;gap:3px}
.mvid svg{width:9px;height:9px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mgrid .mitem{display:flex;flex-direction:column;gap:6px}
.mgrid .media{width:100%}
.mgrid select{padding:6px 8px;font-size:12px}
.addmedia{width:96px;aspect-ratio:1;flex:none;border:1.5px dashed var(--muted);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;padding:6px}
.mpend{display:flex;flex-direction:column;gap:4px;flex:none;width:96px}
.mpend select{font-size:11px;padding:4px 6px;border-radius:8px}
/* sheets */
.sheet{position:absolute;inset:12px 0 0 0;background:var(--bg);z-index:20;display:flex;flex-direction:column;border-radius:24px 24px 0 0;overflow:hidden;box-shadow:0 -10px 30px -12px rgba(0,0,0,.45),0 0 0 100vmax var(--backdrop);animation:up .3s ease-out}
@keyframes up{from{transform:translateY(32px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px max(12px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-head h2{flex:1;text-align:center;font-size:19px;line-height:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body>*{flex-shrink:0}
.sheet-body{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.sheet-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px}
.sheet-foot .btn{flex:1}
.modepick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modepick button{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font-weight:600;font-size:15px}
.modepick button small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.modepick button svg{flex:none;width:24px;height:24px}
.modepick button.on{border-color:var(--granite);background:color-mix(in srgb,var(--granite) 10%,var(--surface));box-shadow:inset 0 0 0 1px var(--granite)}
.modepick button.on svg{color:var(--granite)}
.group{display:flex;flex-direction:column;gap:14px;padding-top:4px;border-top:1px solid var(--line)}
.group>.eyebrow{padding-top:12px}
.routepick{display:flex;flex-direction:column;gap:4px;max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px}
.rp{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;border:0;background:transparent;padding:8px;border-radius:8px}
.rp:hover{background:var(--sunk)}
.rp.on{background:var(--sunk);outline:1.5px solid var(--granite)}
.rp small{grid-column:1;color:var(--muted);font-size:12px}
.rp .grade{grid-row:1/3;grid-column:2;align-self:center}
.auto{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:13px}
.auto b{font-weight:500;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted);margin:0;padding:8px 10px;border-left:3px solid var(--sea);background:var(--sunk);border-radius:0 8px 8px 0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.stepper button[disabled]{opacity:.35}
.stepper span{font-weight:600;font-size:22px;line-height:26px;font-variant-numeric:tabular-nums;min-width:28px;text-align:center}
.stepper.sm{gap:6px}.stepper.sm button{width:28px;height:28px;font-size:15px;border-radius:8px}.stepper.sm span{font-size:17px;min-width:20px}
.pending{display:flex;flex-direction:column;gap:6px}
.pend{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 8px 7px 10px;font-size:13px}
.pend.gone{opacity:.45}.pend.gone b{text-decoration:line-through}
.pend .iconbtn svg{width:20px;height:20px}
input[type=range]{width:100%;accent-color:var(--granite)}
/* charts */
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:9px;font-variant-numeric:tabular-nums}
.bar-row{display:grid;grid-template-columns:62px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.bar-track i{display:block;height:100%}
.bar-row .num{text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.insight{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.insight .mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;background:var(--sunk);color:var(--granite)}
.insight .mark svg{width:18px;height:18px}
.insight p{margin:0}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
/* cv */
.cvhead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.headline{display:flex;gap:6px;flex-wrap:wrap}
.hl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:84px}
.hl .k{font-size:12px;color:var(--muted)}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.skill{display:flex;flex-direction:column;gap:5px;padding:9px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.skill.zero{background:transparent;border-style:dashed}
.skill .top2{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.skill .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skill .lv{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.skill .lv small{font-weight:500;font-size:10px;color:var(--muted);margin-right:2px}
.meter{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--granite)}
.skill .sub{font-size:11px;color:var(--muted)}
.matrix{border-collapse:separate;border-spacing:3px;width:100%;font-size:11px}
.matrix th{font-weight:600;color:var(--muted);text-align:center;font-size:11px}
.matrix th:first-child{text-align:left}
.matrix td{text-align:center;border-radius:6px;height:26px;font-size:11px;font-variant-numeric:tabular-nums}
.matrix td.rk{text-align:left;font-weight:600;font-size:12px}
.matrix td.none{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--sunk) 4px 6px);color:var(--muted)}
.xp{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.xp:last-child{border-bottom:0}
.xp .ico{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--sunk);grid-row:1/3}
.xp small{grid-column:2;color:var(--muted);font-size:12px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12px}
.badge .medal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;border:2px solid var(--granite);color:var(--granite)}
.badge.locked{opacity:.45}.badge.locked .medal{border-style:dashed;border-color:var(--muted);color:var(--muted)}
/* gear and shoes */
.rack{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gear{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:12px;font-weight:500;text-align:center;line-height:1.2;position:relative}
.gear .gearicon{width:100%;height:auto;max-width:84px}
.gear .cnt{position:absolute;top:6px;right:7px;font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted)}
.gear.off{opacity:.5;border-style:dashed}
.gearicon{border-radius:8px;display:block}
.due{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;white-space:nowrap}
.due.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.due.bad{background:color-mix(in srgb,var(--bad) 8%,transparent);color:var(--bad)}
.due.ok{background:var(--sunk);color:var(--muted)}
.gearrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.gearrow:last-child{border-bottom:0}
.gearrow .nm{font-size:13px;font-weight:600}
.gearrow small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.delta-chip{font-size:11px;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:6px;background:var(--sunk)}
.rackstrip{display:flex;gap:4px;flex-wrap:wrap}
.hero{display:grid;place-items:center;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.hero svg{width:min(220px,70%);height:auto}
.shoes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shoe{display:flex;flex-direction:column;gap:4px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.shoe svg{width:100%;height:auto;border-radius:8px}
.shoe b{font-size:13px;font-weight:600}
.shoe small{font-size:12px;color:var(--muted)}
.shoe.off{opacity:.55;border-style:dashed}
/* training */
.bench{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px}
.bench .big{font-weight:600;font-size:22px;line-height:26px;font-variant-numeric:tabular-nums}
.bench .big small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.delta{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}
/* topo maker */
.topomaker{touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.toolrow{display:flex;gap:6px;overflow-x:auto}
.tool{border:1px solid transparent;background:var(--sunk);border-radius:8px;padding:7px 10px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
.tool.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pitchrow{display:grid;grid-template-columns:32px 1fr 74px;gap:8px;align-items:center}
.colcard{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.range{display:grid;grid-template-columns:56px 1fr auto 1fr;gap:6px;align-items:center;font-size:12px}
.range .input,.colcard .input{padding:7px 8px;font-size:13px}
.comment{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:14px}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:500;z-index:50;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.note{font-size:13px;color:var(--muted);margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.swatch{display:flex;gap:3px}.swatch i{width:14px;height:14px;border-radius:4px;display:block}

/* ---------- topo, wall and photo rendering ---------- */
// Fixed brand colours for marks drawn on photos, which look the same in both themes (docs/DESIGN.md).
const BRAND={night:'#1B2240',foam:'#F7E7CE',granite:'#E07A5F'};
const ROCKC={Granite:['#C3B3A4','#8F7E72'],Gneiss:['#97948F','#5E5C59'],Limestone:['#DCD1B8','#AE9C7E'],Sandstone:['#D8B78C','#A5805A'],Basalt:['#77736C','#47443F'],Conglomerate:['#A99A86','#6F6252'],Quartzite:['#D9D4CC','#A39C91']};
function genTopo(r){
  const rr=mulberry32(hash(r.id));let x=90+rr()*120,y=388;const pts=[[x,y]];
  const n=8;for(let i=1;i<=n;i++){y=388-i*(366/n);x=clamp(x+(rr()-.5)*70,40,260);pts.push([Math.round(x),Math.round(y)])}

  const along=t=>{const f=t*(pts.length-1),i=Math.floor(f),k=f-i,p=pts[i],q=pts[Math.min(i+1,pts.length-1)];return[p[0]+(q[0]-p[0])*k,p[1]+(q[1]-p[1])*k]};
  if(r.prot==='Bolted'||r.prot==='Mixed')for(let t=.1;t<.95;t+=.11){const[a,b]=along(t);marks.push({t:'bolt',x:a+7,y:b})}
  if(r.prot==='Trad'||r.prot==='Mixed'||r.prot==='Runout')for(let t=.14;t<.9;t+=r.prot==='Runout'?.3:.16){const[a,b]=along(t+rr()*.04);marks.push({t:'gear',x:a-8,y:b})}
  if(r.pitches>1)for(let p=1;p<Math.min(r.pitches,6);p++){const[a,b]=along(p/Math.min(r.pitches,6));marks.push({t:'belay',x:a,y:b})}
  const[cx,cy]=along(.45+rr()*.3);marks.push({t:'crux',x:cx+12,y:cy});
  marks.push({t:'anchor',x:pts[n][0],y:pts[n][1]});

}

/* ---------- the Sva mark ---------- */
// The mark from packages/sva_ui (SvaMark): the sun sits low on the left in Midnight sun and high on the right in
// Daylight, and travels between the two along an arc when the theme changes. 0 is Midnight sun, 1 is Daylight.
const MARKC={night:{sun:'#F2B544',hi:'#E07A5F',lo:'#F0A08A'},day:{sun:'#D4694C',hi:'#1B2240',lo:'#5B6185'}};
let markT=0,markTarget=0,markAnim=0;
function mixHex(a,b,t){const p=parseInt(a.slice(1),16),q=parseInt(b.slice(1),16),c=s=>Math.round(((p>>s)&255)+(((q>>s)&255)-((p>>s)&255))*t);return'#'+((1<<24)|(c(16)<<16)|(c(8)<<8)|c(0)).toString(16).slice(1)}
function markState(t){const u=1-t;return{x:9*u*u+12*2*u*t+57*t*t,y:47*u*u+0*2*u*t+10*t*t,sun:mixHex(MARKC.night.sun,MARKC.day.sun,t),hi:mixHex(MARKC.night.hi,MARKC.day.hi,t),lo:mixHex(MARKC.night.lo,MARKC.day.lo,t)}}
function svaMark(size=36,label=true){const m=markState(markT);
  return`<svg class="sva-mark" viewBox="0 0 64 64" width="${size}" height="${size}" ${label?'role="img" aria-label="Sva"':'aria-hidden="true"'}><circle class="sm-sun" cx="${m.x.toFixed(2)}" cy="${m.y.toFixed(2)}" r="6" fill="${m.sun}"/><path class="sm-hi" d="M26 52 L41 12 C43 7 47 7 49 12 L62 52Z" fill="${m.hi}"/><path class="sm-lo" d="M14 52 L25 31 C27 27 30 27 32 31 L42 52Z" fill="${m.lo}"/></svg>`}
function paintMarks(){const m=markState(markT);document.querySelectorAll('.sva-mark').forEach(s=>{const sun=s.querySelector('.sm-sun');sun.setAttribute('cx',m.x.toFixed(2));sun.setAttribute('cy',m.y.toFixed(2));sun.setAttribute('fill',m.sun);s.querySelector('.sm-hi').setAttribute('fill',m.hi);s.querySelector('.sm-lo').setAttribute('fill',m.lo)})}
const easeInOutCubic=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const osDark=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
const reduceMotion=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
// The theme the phone shows: the prototype's own choice, else the host page's data-theme, else the OS setting.
function effectiveTheme(){if(S.theme==='dark'||S.theme==='light')return S.theme;const h=document.documentElement.getAttribute('data-theme');if(h==='dark'||h==='light')return h;return osDark&&osDark.matches?'dark':'light'}
function syncMark(){
  const target=effectiveTheme()==='light'?1:0;if(target===markTarget)return;markTarget=target;cancelAnimationFrame(markAnim);
  if(reduceMotion&&reduceMotion.matches){markT=target;paintMarks();return}
  const from=markT,t0=performance.now(),dur=900;
  const step=now=>{const p=Math.min(1,(now-t0)/dur);markT=from+(target-from)*easeInOutCubic(p);paintMarks();if(p<1)markAnim=requestAnimationFrame(step)};
  markAnim=requestAnimationFrame(step);
}

function dayAsc(id){return ASC.filter(a=>a.day===id)}
function bestRoute(as){const s=as.filter(isSend);const list=(s.length?s:as).map(R);return list.sort((a,b)=>((b.g??0)+OFF[b.disc]*(b.pitches>1?1:0))-((a.g??0)+OFF[a.disc]*(a.pitches>1?1:0)))[0]}
function dayStats(d,as){return{climbs:as.length,pitches:sum(as.map(a=>R(a).pitches)),metres:sum(as.map(a=>R(a).len)),elev:d.elev}}
function mediaStrip(d,max=5){

}

    ${as.length>climbsShown.length?`<button class="act" style="align-self:flex-start" data-a="openDay" data-id="${d.id}">+${as.length-climbsShown.length} more climbs</button>`:''}</div>
   ${c.indoor?'':`<div class="row wrap" style="gap:5px">${[...new Set(as.flatMap(a=>[...R(a).features,...R(a).holds,...a.tags]))].slice(0,6).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`}

    <div class="stat"><div class="v">${d.hours}<small style="font-size:12px"> h</small></div><div class="k">Session</div></div>`:`

function viewFeed(){

function weekLine(){const from=addDays(TODAY,-30),as=mine().filter(a=>a.date>=from);const out=new Set(as.filter(a=>!isIn(a)).map(a=>a.date)).size,ind=new Set(as.filter(isIn).map(a=>a.date)).size;return`${out} days outside · ${ind} gym sessions · ${as.filter(isSend).length} sends`}

function saveLog(){
  if(!L.editDay)rememberMode(L.mode);

  }else{
    if(L.ic.style){A.addIndoor(null,true);curIdx=L.pending.length-1}

  }
  const day=DAYS[id];
  if(L.removed.length){const rm=new Set(L.removed);for(let i=ASC.length-1;i>=0;i--)if(rm.has(ASC[i].id))ASC.splice(i,1);
    const left=new Set(dayAsc(id).map(a=>R(a).id));day.media.forEach(m=>{if(m.route&&!left.has(m.route))m.route=null})}
  if(edit){day.title=L.title.trim();day.desc=L.desc.trim();day.partners=[...L.partners]}
  else{if(L.title.trim())day.title=L.title.trim();if(L.desc.trim())day.desc=L.desc.trim();day.partners=[...new Set([...day.partners,...L.partners])]}
  day.shoe=L.shoe||defaultShoe();

  const left=dayAsc(id).length;
  if(!left){delete DAYS[id];toast('Session deleted: no climbs left');S.sheet=null;S.stack=[];render();return}
  toast(edit?`Session updated: ${left} climbs`:`Saved: ${ids.length} ${ids.length===1?'climb':'climbs'}`);
  S.sheet=edit?'day':null;S.day=id;S.stack=[];if(!edit)S.tab='feed';render();if(!edit)$('.screen').scrollTop=0;
}

function bindTopo(){
  const svg=$('#tm');if(!svg)return;let drawing=false;
  const pt=e=>{const b=svg.getBoundingClientRect();return[Math.round((e.clientX-b.left)/b.width*300),Math.round((e.clientY-b.top)/b.height*400)]};
  svg.addEventListener('pointerdown',e=>{const p=pt(e);
    if(T.tool==='line'){drawing=true;svg.setPointerCapture(e.pointerId);T.undo.push({k:'pts',n:T.pts.length});T.pts.push(p);upd()}
    else{T.marks.push({t:T.tool,x:p[0],y:p[1]});T.undo.push({k:'mark'});$('#tm-m').innerHTML=T.marks.map(markSVG).join('')}});
  svg.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e),l=T.pts[T.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>6){T.pts.push(p);upd()}});
  const end=()=>{drawing=false};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  function upd(){const d=pathD(T.pts);$('#tm-p').setAttribute('d',d);$('#tm-c').setAttribute('d',d)}
}

function histOverview(){
  const m=mine(),mo=mineOut(),dayObjs=Object.values(DAYS).filter(d=>d.who==='me');
  const countries=new Set(mo.map(a=>C(a).country));

   <div class="section"><h2>Where you climb</h2>${placesBars()}</div>`;

function heatmap(){
  const per={},gym={};mine().forEach(a=>{if(isIn(a))gym[a.date]=1;else per[a.date]=(per[a.date]||0)+R(a).pitches});
  let start=addDays(TODAY,-364);const dow=new Date(start+'T12:00:00Z').getUTCDay();start=addDays(start,-((dow+6)%7));
  const cs=6,gap=1.4,cols=53;let s='',lastM=-1;
  for(let w=0;w<cols;w++)for(let k=0;k<7;k++){const d=addDays(start,w*7+k);if(d>TODAY)continue;const v=per[d]||0;
    const fill=v?'var(--granite)':gym[d]?'var(--sea)':'var(--line)';const op=v?clamp(.3+v/14,.3,1):gym[d]?.75:1;
    s+=`<rect x="${w*(cs+gap)}" y="${12+k*(cs+gap)}" width="${cs}" height="${cs}" rx="1.2" fill="${fill}" fill-opacity="${op.toFixed(2)}"><title>${fmtDate(d)}: ${v?v+' pitches':gym[d]?'gym':'rest'}</title></rect>`;
    if(k===0&&month(d)!==lastM&&+d.slice(8)<=7){lastM=month(d);s+=`<text x="${w*(cs+gap)}" y="8">${MON[lastM]}</text>`}}
  const W=cols*(cs+gap);
  return`<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${12+7*(cs+gap)}" style="min-width:330px">${s}</svg></div>`;
}
function placesBars(){
  const by={};mine().forEach(a=>{const c=C(a);const k=c.short;by[k]=by[k]||{c,days:new Set(),p:0};by[k].days.add(a.date);by[k].p+=R(a).pitches});
  const rows=Object.entries(by).sort((a,b)=>b[1].days.size-a[1].days.size),mx=Math.max(...rows.map(r=>r[1].days.size));

function insights(){
  const m=mineOut(),out=[];
  const os={};m.filter(a=>a.style==='Onsight'&&!isB(R(a))).forEach(a=>{const k=C(a).rock;os[k]=Math.max(os[k]??-1,R(a).g)});
  const oe=Object.entries(os).sort((a,b)=>b[1]-a[1]);
  if(oe.length>1){const[h,l]=[oe[0],oe[oe.length-1]];if(h[1]>l[1])out.push(['OS',`Your best onsight on <b>${h[0].toLowerCase()}</b> is ${gNameScope(0,h[1])}, but only ${gNameScope(0,l[1])} on <b>${l[0].toLowerCase()}</b>.`])}
  const t={};m.filter(a=>a.style==='Redpoint').forEach(a=>{const k=R(a).angle;(t[k]=t[k]||[]).push(a.att)});
  const te=Object.entries(t).filter(e=>e[1].length>1).map(([k,v])=>[k,sum(v)/v.length]).sort((a,b)=>b[1]-a[1]);
  if(te.length>1)out.push(['RP',`Redpoints on <b>${te[0][0].toLowerCase()}</b> terrain take you ${te[0][1].toFixed(1)} tries on average, against ${te[te.length-1][1].toFixed(1)} on ${te[te.length-1][0].toLowerCase()}.`]);
  const tb={};m.forEach(a=>{const k=TEMPB(a.temp);tb[k]=tb[k]||[0,0];tb[k][1]++;if(isSend(a))tb[k][0]++});
  const tbe=Object.entries(tb).filter(e=>e[1][1]>8).map(([k,v])=>[k,Math.round(100*v[0]/v[1])]).sort((a,b)=>b[1]-a[1]);
  if(tbe.length>1)out.push(['°C',`You send <b>${tbe[0][1]} %</b> of your tries at ${tbe[0][0]}, and ${tbe[tbe.length-1][1]} % at ${tbe[tbe.length-1][0]}.`]);
  const gc={};mine().filter(a=>isIn(a)&&R(a).gcol).forEach(a=>{const k=R(a).gcol.n;gc[k]=gc[k]||[0,0,R(a).g??0];gc[k][1]++;if(a.style==='Flash')gc[k][0]++});
  const ge=Object.entries(gc).filter(e=>e[1][1]>=5).sort((a,b)=>b[1][2]-a[1][2]);
  if(ge.length>1)out.push(['IN',`At the gym you flash <b>${Math.round(100*ge[1][1][0]/ge[1][1][1])} %</b> of ${ge[1][0].toLowerCase()}s and ${Math.round(100*ge[0][1][0]/ge[0][1][1])} % of ${ge[0][0].toLowerCase()}s.`]);
  const lt=m.filter(a=>tradish(R(a))&&a.lead==='Lead').sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(lt){const n=Math.round((new Date(TODAY)-new Date(lt.date))/864e5);out.push(['TR',`<b>${n} ${n===1?'day':'days'}</b> since your last trad lead (${esc(R(lt).name)}). ${m.filter(a=>R(a).disc==='Trad'&&a.lead==='Lead').length} trad leads logged in total.`])}
  const due=GEAR.filter(g=>{const s=gearStatus(g);return s&&s.remind&&s.lvl!=='ok'});
  if(due.length)out.push(['!',`${due.length} ${due.length===1?'piece':'pieces'} of gear need attention: ${esc(due.map(g=>g.label).join(', '))}. See My rack on your CV.`]);
  const feats=new Set(m.flatMap(a=>R(a).features));const missing=DIMS.feat.all.filter(f=>!feats.has(f));
  if(missing.length)out.push(['?',`No logged climbs with <b>${missing.map(x=>x.toLowerCase()).join('</b> or <b>')}</b>. That is the biggest gap in your CV.`]);
  return out;
}
const PYRDISC=['All routes','Sport','Trad','Multipitch','Alpine','Boulder'];

function histProgress(){
  const boulder=S.prog==='boulders';
  const s=mineOut().filter(isNewSend).filter(a=>isB(R(a))===boulder);
  const qs=[];for(let y=2024;y<=2026;y++)for(let q=0;q<4;q++){const k=y+' Q'+(q+1);if(k<'2024 Q4')continue;qs.push(k)}
  const qk=d=>d.slice(0,4)+' Q'+(Math.floor(month(d)/3)+1);
  const maxQ=qs.map(k=>{const v=s.filter(a=>qk(a.date)===k).map(a=>R(a).g).sort((a,b)=>b-a);return{k,max:v.length?v[0]:null,avg:v.length?sum(v.slice(0,5))/Math.min(5,v.length):null}});
  const vals=maxQ.flatMap(q=>[q.max,q.avg]).filter(v=>v!=null);
  const lo=Math.floor(Math.min(...vals))-1,hi=Math.ceil(Math.max(...vals))+1;
  const W=340,H=190,pl=46,pr=8,pt=10,pb=24;
  const x=i=>pl+i*(W-pl-pr)/(qs.length-1),y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  let g='';for(let v=lo;v<=hi;v++){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width=".6"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${esc(gNameScope(boulder,v))}</text>`}
  qs.forEach((k,i)=>{if(i%2===0||i===qs.length-1)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${k.slice(2).replace(' ','·')}</text>`});
  const line=(key,col,dash)=>{const p=maxQ.map((q,i)=>q[key]==null?null:[x(i),y(q[key])]).filter(Boolean);
    return`<path d="${p.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join('')}" fill="none" stroke="${col}" stroke-width="2.2" ${dash?'stroke-dasharray="4 3"':''}/>`+p.map((c,i)=>`<circle cx="${c[0]}" cy="${c[1]}" r="${i===p.length-1?4:2.6}" fill="${col}"/>`).join('')};
  const last=maxQ.filter(q=>q.max!=null),fq=last[0],end=last[last.length-1];
  return`<div class="section"><div class="seg">${[['routes','Routes'],['boulders','Boulders']].map(([k,l])=>`<button class="${S.prog===k?'on':''}" data-a="prog" data-v="${k}">${l}</button>`).join('')}</div></div>
   <div class="section"><h2>Hardest send per quarter</h2>
   <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grade progression">${g}${line('avg','var(--muted)',true)}${line('max','var(--granite)')}</svg>
   <div class="legend"><span><i style="background:var(--granite)"></i>Hardest send</span><span><i style="background:var(--muted)"></i>Average of top 5</span></div>
   ${fq&&end?`<div class="card insight"><span class="mark">+${Math.round(end.max-fq.max)}</span><p>From ${esc(gNameScope(boulder,fq.max))} in ${fq.k} to ${esc(gNameScope(boulder,end.max))} in ${end.k}. Outdoor climbs only.</p></div>`:''}</div>`;
}
function histExplore(){
  const e=S.ex,M=METRICS[e.metric];
  let as=mine().filter(a=>e.scope==='boulders'?isB(R(a)):!isB(R(a)));
  if(e.setting!=='all')as=as.filter(a=>isIn(a)===(e.setting==='indoor'));
  if(e.period==='12m')as=as.filter(a=>a.date>=addDays(TODAY,-365));
  const groups={};as.forEach(a=>DIMS[e.group].get(a).forEach(v=>{(groups[v]=groups[v]||[]).push(a)}));
  let all=DIMS[e.group].all||Object.keys(groups);
  if(e.group==='rock'&&groups.Plastic)all=[...all,'Plastic'];
  if(e.group==='temp'&&groups.Indoor)all=[...all,'Indoor'];
  let rows=all.map(k=>[k,groups[k]?M.f(groups[k]):null]);
  rows.sort((a,b)=>(b[1]??-1)-(a[1]??-1));
  const mx=M.max||Math.max(...rows.map(r=>r[1]??0),1);
  const opt=(id,obj,val,lbl)=>`<div class="field" style="flex:1;min-width:140px"><label for="${id}">${lbl}</label><select class="input" id="${id}" data-ex="${id.slice(3)}">${Object.entries(obj).map(([k,v])=>`<option value="${k}" ${k===val?'selected':''}>${esc(v.label||v)}</option>`).join('')}</select></div>`;
  return`<div class="section"><div class="row wrap" style="gap:10px;align-items:flex-end">
    ${opt('ex-metric',METRICS,e.metric,'Show')}
    ${opt('ex-group',Object.fromEntries(Object.entries(DIMS).filter(([k])=>k!=='style'||e.metric!=='rate')),e.group,'Grouped by')}

function radar(labels,vals){
  const cx=170,cy=118,R0=88,n=labels.length,ang=i=>-Math.PI/2+i*2*Math.PI/n,pt=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];
  let s='';[.25,.5,.75,1].forEach(f=>{s+=`<polygon points="${labels.map((_,i)=>pt(i,R0*f).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`});
  labels.forEach((l,i)=>{const[x,y]=pt(i,R0);const[lx,ly]=pt(i,R0+16);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/><text x="${lx}" y="${ly+3}" text-anchor="${Math.abs(lx-cx)<5?'middle':lx>cx?'start':'end'}" style="font-size:10px;fill:var(--ink);font-family:var(--f-body);font-weight:600">${l}</text>`});
  s+=`<polygon points="${vals.map((v,i)=>pt(i,R0*Math.max(.04,v)).join(',')).join(' ')}" fill="var(--granite)" fill-opacity=".22" stroke="var(--granite)" stroke-width="2"/>`;
  vals.forEach((v,i)=>{const[x,y]=pt(i,R0*Math.max(.04,v));s+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--granite)"/>`});
  return`<svg class="chart" viewBox="0 0 340 236" role="img" aria-label="Style profile radar">${s}</svg>`;
}

/* ---------- training ---------- */
function spark(b,w=96,h=30){const v=b.hist.map(h=>h.v),lo=Math.min(...v),hi=Math.max(...v),x=i=>i*(w-4)/(v.length-1)+2,y=t=>h-3-(t-lo)/((hi-lo)||1)*(h-6);
  const d=v.map((t,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(t).toFixed(1)).join('');
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${x(v.length-1)} ${h} L${x(0)} ${h}Z" fill="var(--granite)" fill-opacity=".12"/><path d="${d}" fill="none" stroke="var(--granite)" stroke-width="1.6"/><circle cx="${x(v.length-1)}" cy="${y(v[v.length-1])}" r="2.6" fill="var(--granite)"/></svg>`}
function bDelta(b){const cur=b.hist[b.hist.length-1].v,ago=b.hist.find(h=>h.date>=addDays(TODAY,-365))?.v??b.hist[0].v;const d=Math.round((cur-ago)*10)/10;const good=b.hi?d>=0:d<=0;return{cur,d,good}}
function viewTrain(){
  const cats=[...new Set(BENCH.map(b=>b.cat))];
  const hang=BENCH[0],hd=bDelta(hang);
  const s=mineOut().filter(x=>isNewSend(x)&&R(x).disc==='Sport'),old=s.filter(x=>x.date<addDays(TODAY,-365)).map(x=>R(x).g);
  const gstep=old.length?Math.max(...s.map(x=>R(x).g))-Math.max(...old):0;
  return`<div class="top"><h1>Training</h1><span class="pill">Example data</span></div>
   <div class="card insight"><span class="mark">${I.trend}</span><p>Max hang is <b>${hd.d>0?'+':''}${hd.d} ${hang.unit}</b> over 12 months. In the same period your hardest outdoor sport send went up by ${gstep} grade steps.</p></div>
   ${cats.map(c=>`<div class="section"><span class="eyebrow">${c}</span>${BENCH.filter(b=>b.cat===c).map(b=>{const{cur,d,good}=bDelta(b);const pr=b.hi?Math.max(...b.hist.map(h=>h.v)):Math.min(...b.hist.map(h=>h.v));
     return`<button class="bench" data-a="openBench" data-id="${b.id}"><div><h3 style="font-size:14.5px">${b.name}</h3><div class="muted" style="font-size:11.5px">${b.proto}</div></div>${spark(b)}
      <div class="big">${cur}<small>${b.unit}</small></div><div style="text-align:right"><span class="delta ${good?'up':'down'}">${d>0?'+':''}${d} in 12 mo</span>${cur===pr?' <span class="pill" style="border-style:solid;color:var(--accent);border-color:var(--accent)">PR</span>':''}</div></button>`}).join('')}</div>`).join('')}`;
}
function sheetBench(){
  const b=BENCH.find(x=>x.id===S.bench),v=b.hist.map(h=>h.v);
  const W=340,H=170,pl=36,pr=10,pt=10,pb=22,lo=Math.min(...v),hi=Math.max(...v),pad=(hi-lo)*.15||1;
  const x=i=>pl+i*(W-pl-pr)/(v.length-1),y=t=>pt+(hi+pad-t)*(H-pt-pb)/(hi-lo+2*pad);
  let g='';for(let k=0;k<=3;k++){const t=lo-pad+k*(hi-lo+2*pad)/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width=".6"/><text x="${pl-5}" y="${y(t)+3}" text-anchor="end">${Math.round(t)}</text>`}
  b.hist.forEach((h,i)=>{if(i%4===0)g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${MON[month(h.date)]} ${h.date.slice(2,4)}</text>`});
  const d=v.map((t,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(t).toFixed(1)).join('');
  const board=[['me',v[v.length-1]],...Object.entries(b.fr)].sort((a,c)=>b.hi?c[1]-a[1]:a[1]-c[1]);const bm=Math.max(...board.map(r=>r[1]),1);
  return sheetWrap(b.name,`
   <p class="note">${b.proto}. ${b.hi?'Higher is better.':'Lower is better.'}</p>
   <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${b.name} over time">${g}<path d="${d} L${x(v.length-1)} ${y(lo-pad)} L${x(0)} ${y(lo-pad)}Z" fill="var(--granite)" fill-opacity=".1"/><path d="${d}" fill="none" stroke="var(--granite)" stroke-width="2"/>${v.map((t,i)=>`<circle cx="${x(i)}" cy="${y(t)}" r="${i===v.length-1?4:2.2}" fill="var(--granite)"><title>${b.hist[i].date}: ${t} ${b.unit}</title></circle>`).join('')}</svg>
   <div class="card stack" style="gap:10px"><h3>Log a new result</h3><div class="row"><input class="input" id="bv" type="number" step="0.5" placeholder="${b.unit}" aria-label="New result in ${b.unit}"><button class="btn sm" data-a="saveBench">Save</button></div></div>
   <div class="stack" style="gap:8px"><h3>Friends</h3>${board.map(([w,val])=>`<div class="bar-row" style="grid-template-columns:110px 1fr 64px"><span class="lab row" style="gap:6px">${av(w,22)}${esc(first(w))}</span><div class="bar-track"><i style="width:${val/bm*100}%;background:${w==='me'?'var(--granite)':'var(--muted)'}"></i></div><span class="num">${val} ${b.unit}</span></div>`).join('')}</div>
   <div class="stack" style="gap:6px"><h3>History</h3>${b.hist.slice().reverse().slice(0,8).map(h=>`<div class="row between mono" style="font-size:12.5px"><span>${fmtDate(h.date)}</span><span>${h.v} ${b.unit}</span></div>`).join('')}</div>`);
}

    ${gyms().map(([id,g])=>`<button class="rp" style="border:1px solid var(--line);background:var(--surface)" data-a="editGym" data-id="${id}"><b>${esc(g.name)}</b><span class="swatch" style="grid-row:1/3;grid-column:2;align-self:center">${g.grading==='colour'&&GYMSCALES[g.scale]?GYMSCALES[g.scale].grades.map(c=>`<i style="background:${c.hex}"></i>`).join(''):`<span class="muted" style="font-size:12px">${g.grading==='standard'?'Standard grades':'Ungraded'}</span>`}</span><small>${g.walls.length} ${g.walls.length===1?'wall':'walls'} · ${esc(g.walls.map(w=>w.name).join(', '))}</small></button>`).join('')}</div>
   <div class="card stack" style="gap:6px"><h3>About this prototype</h3><p class="note">All climbs, friends, crags, gyms, gear and training results are generated example data. Everything you change works, but resets when the page reloads. Your theme and profile picture are remembered in this browser.</p></div>`);

/* ---------- shell ---------- */
function sheetWrap(title,body,foot='',back=false){
  return`<div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="sheet-head"><button class="iconbtn" data-a="${back?'back':'close'}" aria-label="${back?'Back':'Close'}">${back?I.back:I.close}</button><h2>${esc(title)}</h2><span style="width:34px"></span></div>
   <div class="sheet-body">${body}</div>${foot?`<div class="sheet-foot">${foot}</div>`:''}</div>`;
}
function render(){
  const sc=$('.screen')?.scrollTop||0,sb=$('.sheet-body')?.scrollTop||0,keepScreen=render.keep;
  const views={feed:viewFeed,history:viewHistory,cv:viewCV,train:viewTrain};
  const sheets={log:sheetLog,newroute:sheetNewRoute,topo:sheetTopo,day:sheetDay,bench:sheetBench,settings:sheetSettings,gym:sheetGym,rack:sheetRack,person:sheetPerson,gear:sheetGear,shoe:sheetShoe};
  const tabs=[['feed','Feed',I.feed],['history','History',I.hist],['log','Log',''],['cv','CV',I.cv],['train','Training',I.train]];
  const app=$('#app');if(S.theme==='system')app.removeAttribute('data-theme');else app.dataset.theme=S.theme;
  const sheet=S.sheet?sheets[S.sheet]():'';
  app.innerHTML=`<main class="screen">${views[S.tab]()}</main>
   <nav class="tabbar">${tabs.map(([k,l,ic])=>k==='log'?`<button class="tab log" data-a="openLog" aria-label="Log a session"><span class="plus">${I.plus}</span>${l}</button>`:`<button class="tab ${S.tab===k?'on':''}" data-a="tab" data-v="${k}" aria-current="${S.tab===k?'page':'false'}">${ic}${l}</button>`).join('')}</nav>
   ${sheet}
   ${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:''}`;
  if(keepScreen&&$('.screen'))$('.screen').scrollTop=sc;
  if(render.keepSheet&&$('.sheet-body'))$('.sheet-body').scrollTop=sb;
  render.keep=render.keepSheet=false;
  if(S.sheet==='topo')bindTopo();
}
function rerender(){render.keep=true;render.keepSheet=true;render()}
let toastT;function toast(t){S.toast=t;clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;const el=document.querySelector('.toast');if(el&&el.remove)el.remove()},2200)}
function pushSheet(n){if(S.sheet)S.stack.push(S.sheet);S.sheet=n;render.keep=true;render()}
function popSheet(){S.sheet=S.stack.pop()||null;render.keep=true;render()}
const tog=(arr,x)=>arr.includes(x)?arr.filter(y=>y!==x):[...arr,x];
function setStyleTries(target,style,prior){if(lockedTries(style))target.att=1;else target.att=Math.max(target.att,minTries(style,prior))}
function loadPfp(file){
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=192;const x=c.getContext('2d'),s=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,192,192);PEOPLE.me.photo=c.toDataURL('image/jpeg',.82);
    try{store?.setItem('pb-pfp',PEOPLE.me.photo)}catch(e){}URL.revokeObjectURL(url);toast('Profile picture updated');rerender()};
  img.onerror=()=>toast('That file could not be read as an image');
  img.src=url;
}

  rmPfp:()=>{PEOPLE.me.photo=null;try{store?.removeItem('pb-pfp')}catch(e){}rerender()},
  kudos:el=>{const d=DAYS[el.dataset.id];d.kudoed=!d.kudoed;rerender()},
  share:()=>{toast('In the app this opens the share sheet with a topo card')},

  pickRoute:el=>{L.route=el.dataset.id;const r=ROUTES[L.route];if(isB(r))L.lead='—';else if(L.lead==='—')L.lead='Lead';
    const pr=priorFor(r.id);L.style=pr.sent?'Repeat':null;L.att=1;if(L.style)setStyleTries(L,L.style,pr.tries);L.rack=needsRack(r)?defRack():null;L.rackOpen=false;rerender()},
  att:el=>{const d=+el.dataset.d;if(el.dataset.t==='ic'){const ic=L.ic;if(lockedTries(ic.style))return;ic.att=Math.max(minTries(ic.style,0),ic.att+d)}
    else{if(lockedTries(L.style))return;L.att=Math.max(minTries(L.style,L.route?priorFor(L.route).tries:0),L.att+d)}rerender()},
  addOut:(el,silent)=>{if(!L.route||!L.style)return;const r=ROUTES[L.route];let rack;if(needsRack(r)&&L.rack){rack={};GEAR.forEach(g=>{const d=(L.rack[g.id]||0)-g.def;if(d)rack[g.id]=d})}
    L.pendOut.push({route:L.route,style:L.style,att:L.att,lead:isB(r)?'—':L.lead,feel:FEEL[L.feel],tags:[...L.tags],cond:L.cond,rack});
    L.media.forEach(m=>{if(m.route==='cur')m.route='p'+(L.pendOut.length-1)});

  rmOut:el=>{const i=+el.dataset.i;L.pendOut.splice(i,1);L.media.forEach(m=>{if(m.route==='p'+i)m.route='';else if(/^p\d+$/.test(m.route)&&+m.route.slice(1)>i)m.route='p'+(+m.route.slice(1)-1)});rerender()},

  pickWall:el=>{selectWall(el.dataset.id);rerender()},
  pickShoe:el=>{L.shoe=el.dataset.id;rerender()},

  addIndoor:(el,silent)=>{const ic=L.ic;if(!ic.style)return;L.pending.push({wall:L.wall,type:ic.type,gi:ic.gi,angle:ic.angle,holds:[...ic.holds],style:ic.style,att:ic.att,tags:[...ic.tags]});ic.style=null;ic.att=1;ic.tags=[];if(!silent){toast(`Added climb ${L.pending.length}`);rerender()}},
  rmIndoor:el=>{const i=+el.dataset.i;L.pending.splice(i,1);L.media.forEach(m=>{if(m.route==='p'+i)m.route='';else if(/^p\d+$/.test(m.route)&&+m.route.slice(1)>i)m.route='p'+(+m.route.slice(1)-1)});rerender()},
  saveLog:()=>saveLog(),

  addGear:()=>{const t=$('#gear-type').value,l=$('#gear-label').value.trim()||GEARTYPES[t];const g={...gearBase,id:'g'+(++aid),type:t,label:l,color:$('#gear-color').value,own:1,def:1,made:NOWYM,bought:NOWYM,remind:RESLING.includes(t)||TEXTILE.includes(t)};GEAR.push(g);S.gearId=g.id;pushSheet('gear')},
  gearRemind:()=>{const g=GEAR.find(x=>x.id===S.gearId);g.remind=!g.remind;toast(g.remind?'Reminder on':'Reminder off');rerender()},
  rmGear:()=>{const i=GEAR.findIndex(x=>x.id===S.gearId);const l=GEAR[i].label;GEAR.splice(i,1);toast(l+' removed');popSheet()},

  shoeResoles:el=>{const s=SHOES.find(x=>x.id===S.shoeId);s.resoles=Math.max(0,s.resoles+ +el.dataset.d);if(+el.dataset.d>0){s.lastResole=NOWYM;toast('Resole logged for '+fmtYM(NOWYM))}rerender()},

  chip:el=>{
    const k=el.dataset.k,v=el.dataset.v,multi=el.dataset.m==='1';
    if(S.sheet==='log'){
      if(k==='partners'){const id=Object.keys(PEOPLE).find(p=>PEOPLE[p].name===v);L.partners=tog(L.partners,id)}
      else if(k==='stars')L.stars=v.length;
      else if(k==='gym'){L.gym=gyms().find(([,c])=>c.short===v)[0];L.ic.gi=null;selectWall(CRAGS[L.gym].walls[0].id)}
      else if(k==='style'){L.style=v;setStyleTries(L,v,L.route?priorFor(L.route).tries:0)}
      else if(k==='istyle'){L.ic.style=v;setStyleTries(L.ic,v,0)}

    }else if(S.sheet==='settings'){
      if(k==='rsys')S.rsys=Object.keys(SYS.route).find(s=>SYS.route[s].label===v);
      if(k==='bsys')S.bsys=Object.keys(SYS.boulder).find(s=>SYS.boulder[s].label===v);
    }else if(S.sheet==='gym'&&k==='grading'){
      const g=CRAGS[S.gym];g.grading={'Colour scale':'colour','Standard grades':'standard','Ungraded':'none'}[v];
      if(g.grading==='colour'){if(!g.scale)g.scale=S.gym;if(!GYMSCALES[g.scale])GYMSCALES[g.scale]={grades:[{n:'Green',hex:'#3FA34D',bmin:null,bmax:null,rmin:null,rmax:null}]}}
      if(L&&L.gym===S.gym)L.ic.gi=null;
    }else if(S.sheet==='shoe'){const s=SHOES.find(x=>x.id===S.shoeId);if(k==='closure')s.closure=v;if(k==='shoefor')s.for=tog(s.for,v)}
    else if(k==='pyr')S.pyr=v;
    rerender();
  }
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el)}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='rq'){L.q=t.value;$('#rlist').innerHTML=routeListHTML();return}
  if(t.id==='feel'){L.feel=+t.value;$('#feel-l').textContent=FEEL[L.feel];return}
  if(t.id==='lg-title')L.title=t.value;
  if(t.id==='lg-desc')L.desc=t.value;
  if(t.id==='nr-name')NR.name=t.value;
  if(t.id==='nr-fa')NR.fa=t.value;
  if(t.id==='nr-p')NR.pitches=Math.max(1,+t.value||1);
  if(t.id==='nr-l')NR.len=Math.max(1,+t.value||1);
  if(t.dataset.pitch!=null){T.pitches[+t.dataset.pitch][t.dataset.f]=+t.value}
  if(S.sheet==='gym'){const g=CRAGS[S.gym];
    if(t.id==='gy-name'){g.name=t.value;g.short=t.value.split(',')[0].slice(0,18)||'Gym'}
    if(t.dataset.wall!=null&&t.dataset.f==='name')g.walls[+t.dataset.wall].name=t.value;
    if(t.dataset.wall!=null&&t.dataset.f==='height')g.walls[+t.dataset.wall].height=Math.max(1,+t.value||1);
    if(t.dataset.col!=null&&(t.dataset.f==='n'||t.dataset.f==='hex'))GYMSCALES[g.scale].grades[+t.dataset.col][t.dataset.f]=t.value;}
  if(t.dataset.gf&&!['reslingYrs','retireYrs'].includes(t.dataset.gf)){const g=GEAR.find(x=>x.id===S.gearId);g[t.dataset.gf]=t.value||(t.type==='month'?null:'')}
  if(t.dataset.sf&&t.dataset.sf!=='resoleAfter'){const s=SHOES.find(x=>x.id===S.shoeId);s[t.dataset.sf]=t.value||(t.type==='month'?null:'')}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='nr-g')NR.g=+t.value;
  if(t.id==='ic-g'){L.ic.gi=t.value===''?null:+t.value}
  if(t.dataset.ex){S.ex[t.dataset.ex]=t.value;if(S.ex.metric==='rate'&&S.ex.group==='style')S.ex.group='rock';rerender()}
  if(t.dataset.col!=null&&['bmin','bmax','rmin','rmax'].includes(t.dataset.f)){const c=GYMSCALES[CRAGS[S.gym].scale].grades[+t.dataset.col],f=t.dataset.f,v=t.value===''?null:+t.value;c[f]=v;
    const lo=f[0]+'min',hi=f[0]+'max';if(c[lo]!=null&&c[hi]!=null&&c[lo]>c[hi]){if(f===lo)c[hi]=c[lo];else c[lo]=c[hi]}if(c[lo]!=null&&c[hi]==null)c[hi]=c[lo];rerender()}
  if(t.dataset.wall!=null&&(t.dataset.f==='angle'||t.dataset.f==='kind')){CRAGS[S.gym].walls[+t.dataset.wall][t.dataset.f]=t.value;if(L&&L.gym===S.gym)selectWall(L.wall)}
  if(t.dataset.lmedia!=null)L.media[+t.dataset.lmedia].route=t.value;
  if(t.dataset.dmedia!=null){const m=DAYS[S.day].media.find(x=>x.id===t.dataset.dmedia);m.route=t.value||null;toast(t.value?'Tagged '+routeById(t.value).name:'Tag removed');rerender()}
  if(t.dataset.gf){const g=GEAR.find(x=>x.id===S.gearId);if(['reslingYrs','retireYrs'].includes(t.dataset.gf))g[t.dataset.gf]=+t.value;rerender()}
  if(t.dataset.sf){const s=SHOES.find(x=>x.id===S.shoeId);if(t.dataset.sf==='resoleAfter')s.resoleAfter=+t.value;rerender()}
  if(t.id==='pfp-in'&&t.files[0])loadPfp(t.files[0]);
  if(t.id==='media-in'||t.id==='media-day'){
    const files=[...t.files].map(f=>({type:f.type.startsWith('video')?'video':'image',url:URL.createObjectURL(f),name:f.name,route:''}));
    if(t.id==='media-in')L.media.push(...files);
    else DAYS[S.day].media.push(...files.map(f=>({id:'m'+(++aid),type:f.type,url:f.url,route:null})));
    if(files.length)toast(files.length+(files.length===1?' file added':' files added'));
    rerender();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cmt')A.comment()});
// No animation on first load: the mark starts where the theme puts it.
markT=markTarget=effectiveTheme()==='light'?1:0;
new MutationObserver(syncMark).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(osDark){if(osDark.addEventListener)osDark.addEventListener('change',syncMark);else if(osDark.addListener)osDark.addListener(syncMark)}
render();
</script>
