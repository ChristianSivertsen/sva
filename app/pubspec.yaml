name: sva
description: Climbing logbook, insights and climbing CV.
publish_to: none
version: 0.2.0+2
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flex_color_picker: ^3.8.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.2
  go_router: ^18.1.2
  intl: ^0.20.3
  latlong2: ^0.10.1
  lucide_icons_flutter: ^3.1.25
  path_provider: ^2.1.6
  sva_core:
    path: ../packages/sva_core
  sva_data:
    path: ../packages/sva_data
  sva_ui:
    path: ../packages/sva_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
